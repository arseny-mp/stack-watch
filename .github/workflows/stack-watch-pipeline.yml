name: Stack Watch Cloud Pipeline

on:
  schedule:
    - cron: '30 9 * * *' # Daily at 09:30 UTC / 15:00 IST / 12:30 MSK
  workflow_dispatch: # Allows manual trigger via GitHub Web UI

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & rclone
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Configure rclone
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [[ -n "$RCLONE_CONFIG" ]]; then
            mkdir -p ~/.config/rclone
            echo "$RCLONE_CONFIG" > ~/.config/rclone/rclone.conf
          else
            echo "Warning: RCLONE_CONFIG secret is not configured."
          fi

      - name: Run Ingest Feed Poller
        run: |
          python3 scripts/poll_feeds.py

      - name: Run AI Noise Screening
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/ai_screening.py

      - name: Run AI Curation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/curate_findings.py

      - name: Upload Daily Run Folder to Google Drive
        run: |
          TODAY=$(date '+%Y-%m-%d')
          if [[ -d "$TODAY" ]]; then
            echo "Uploading today's daily run folder (feeds + curated findings) to Google Drive..."
            rclone copy "$TODAY" gdrive:"Stack Watch/raw-feed/$TODAY"
          else
            echo "No daily directory found to upload."
          fi

      - name: Run Research Bridge
        env:
          TELEGRAM_TOKEN_UPDATES: ${{ secrets.TELEGRAM_TOKEN_UPDATES }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          # Make scripts executable just in case
          chmod +x scripts/bridge-antigravity-research.sh
          chmod +x scripts/generate_dashboard.py
          
          # Run the bridge script (which will compile daily reports, rolling archives, and rebuild index.html)
          ./scripts/bridge-antigravity-research.sh

      - name: Deliver Telegram Notification
        env:
          TELEGRAM_TOKEN_UPDATES: ${{ secrets.TELEGRAM_TOKEN_UPDATES }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/deliver.py

      - name: Deliver Email Notification
        env:
          EMAIL_SMTP_PASSWORD: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          EMAIL_SENDER: "admin@myprtech.org"
          EMAIL_RECIPIENTS: "admin@myprtech.org"
        run: |
          python3 scripts/deliver_email.py

      - name: Commit State & Cache Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add processed/seen_releases.json _seen-urls.txt index.html processed/updates-*.txt processed/email-*.txt || echo "No state files to add"
          git commit -m "chore: update seen cache, state, email and static dashboard [skip ci]" || echo "No state changes to commit"
          git push || echo "No changes to push"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # upload repository root containing index.html

  deploy-dashboard:
    needs: run-pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
