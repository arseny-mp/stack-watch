name: Stack Watch Cloud Pipeline

on:
  schedule:
    - cron: '30 9 * * *' # Daily at 09:30 UTC / 15:00 IST / 12:30 MSK
  workflow_dispatch: # Allows manual trigger via GitHub Web UI

permissions:
  contents: write
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & rclone
        run: |
          python -m pip install --upgrade pip
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Run Google Drive Pre-flight Check
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          chmod +x scripts/check_drive_drop.sh
          ./scripts/check_drive_drop.sh

      - name: Run Feed Poller and Screening
        if: env.SKIP_SCRIPTS != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/poll_feeds.py
          python3 scripts/ai_screening.py

      - name: Run Autonomous Curation Agent
        if: env.SKIP_SCRIPTS != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 scripts/curate_findings.py

      - name: Sync API-generated Drop to Google Drive
        if: env.SKIP_SCRIPTS != 'true'
        env:
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          TODAY=$(date '+%Y-%m-%d')
          if [[ -d "$TODAY" ]]; then
            echo "Uploading API-generated daily folder to Google Drive..."
            rclone copy "$TODAY" gdrive:"Stack Watch/knowledge-base/$TODAY"
          else
            echo "No daily folder $TODAY found to upload."
          fi

      - name: Run Research Bridge
        env:
          TELEGRAM_TOKEN_UPDATES: ${{ secrets.TELEGRAM_TOKEN_UPDATES }}
          RCLONE_CONFIG: ${{ secrets.RCLONE_CONFIG }}
        run: |
          # Make scripts executable just in case
          chmod +x scripts/bridge-antigravity-research.sh
          chmod +x scripts/generate_dashboard.py
          
          # Run the bridge script (which will compile daily reports, rolling archives, and rebuild index.html)
          ./scripts/bridge-antigravity-research.sh

      - name: Deliver Telegram Notification
        env:
          TELEGRAM_TOKEN_UPDATES: ${{ secrets.TELEGRAM_TOKEN_UPDATES }}
          TELEGRAM_HOME_CHANNEL: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUMMARY_DIR: "/tmp/Project-Instructions-Template/project-status/_summary"
          RESEARCH_DIR: "/tmp/Project-Instructions-Template/external-research"
        run: |
          chmod +x scripts/updates-news-deliver.sh
          ./scripts/updates-news-deliver.sh

      - name: Commit State & Cache Updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add processed/seen_releases.json _seen-urls.txt index.html
          git commit -m "chore: update seen cache and static dashboard [skip ci]" || echo "No state changes to commit"
          git push || echo "No changes to push"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # upload repository root containing index.html

  deploy-dashboard:
    needs: run-pipeline
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
